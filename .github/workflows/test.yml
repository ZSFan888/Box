name: Build and Release APKs

on:
#  push:
#    branches:
#      - main
#  pull_request:
  workflow_dispatch:
    inputs:
      app_name:
        description: App display name
        required: true
        default: TVBox
        type: string
      version_prefix:
        description: Version prefix, for example 1.0 or 2.5
        required: true
        default: '1.0'
        type: string
      icon_url:
        description: Optional direct URL to a 512x512 PNG app icon
        required: false
        type: string
      banner_url:
        description: Optional direct URL to a 640x360 PNG TV banner
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'

      - name: Apply optional artwork
        env:
          ICON_URL: ${{ inputs.icon_url }}
          BANNER_URL: ${{ inputs.banner_url }}
        run: |
          python - <<'PY'
          import os
          import struct
          import urllib.request
          from pathlib import Path

          PNG_SIGNATURE = b"\x89PNG\r\n\x1a\n"
          MAX_IMAGE_SIZE = 10 * 1024 * 1024

          def apply_image(env_name, destination, expected_size):
              url = os.environ.get(env_name, "").strip()
              if not url:
                  return

              request = urllib.request.Request(url, headers={"User-Agent": "TVBox-build"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = response.read(MAX_IMAGE_SIZE + 1)

              if len(data) > MAX_IMAGE_SIZE:
                  raise ValueError(f"{env_name} exceeds 10 MB")
              if len(data) < 24 or data[:8] != PNG_SIGNATURE or data[12:16] != b"IHDR":
                  raise ValueError(f"{env_name} must point directly to a PNG file")

              size = struct.unpack(">II", data[16:24])
              if size != expected_size:
                  raise ValueError(f"{env_name} must be {expected_size[0]}x{expected_size[1]}, got {size[0]}x{size[1]}")

              Path(destination).write_bytes(data)

          apply_image("ICON_URL", "app/src/main/res/drawable/app_icon.png", (512, 512))
          apply_image("BANNER_URL", "app/src/main/res/drawable/app_banner.png", (640, 360))
          PY

      - name: Prepare release metadata
        env:
          INPUT_APP_NAME: ${{ inputs.app_name }}
          INPUT_VERSION_PREFIX: ${{ inputs.version_prefix }}
        run: |
          app_name="${INPUT_APP_NAME:-TVBox}"
          version_prefix="${INPUT_VERSION_PREFIX:-1.0}"
          if [[ -z "$app_name" || ${#app_name} -gt 30 || "$app_name" == *$'\n'* || "$app_name" == *$'\r'* ]]; then
            echo "App name must contain 1-30 characters on one line." >&2
            exit 1
          fi
          if [[ ! "$version_prefix" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Version prefix must look like 1.0 or 2.5.1." >&2
            exit 1
          fi
          build_time="$(TZ=Asia/Shanghai date +'%Y%m%d_%H%M')"
          release_time="$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          printf 'TVBOX_APP_NAME=%s\n' "$app_name" >> "$GITHUB_ENV"
          printf 'TVBOX_VERSION_CODE=%s\n' "$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          printf 'TVBOX_VERSION_NAME=%s.%s\n' "$version_prefix" "$build_time" >> "$GITHUB_ENV"
          printf 'RELEASE_TAG=v%s.%s\n' "$version_prefix" "$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          printf 'RELEASE_TITLE=%s %s\n' "$app_name" "$release_time" >> "$GITHUB_ENV"

      - name: Configure release signing
        env:
          TVBOX_SIGNING_KEY: ${{ secrets.TVBOX_SIGNING_KEY }}
        run: |
          test -n "$TVBOX_SIGNING_KEY"
          printf '%s' "$TVBOX_SIGNING_KEY" | base64 --decode > app/release.p12

      - name: Build release APKs
        env:
          TVBOX_KEYSTORE_FILE: ${{ github.workspace }}/app/release.p12
          TVBOX_STORE_PASSWORD: ${{ secrets.TVBOX_STORE_PASSWORD }}
          TVBOX_KEY_ALIAS: ${{ secrets.TVBOX_KEY_ALIAS }}
          TVBOX_KEY_PASSWORD: ${{ secrets.TVBOX_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          ./gradlew assembleRelease --build-cache --parallel --no-daemon --stacktrace --warning-mode all

      - name: Collect and verify APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -type f -name '*.apk' -exec cp '{}' artifacts/ \;
          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$apksigner"
          for apk in artifacts/*.apk; do
            "$apksigner" verify --verbose "$apk"
          done
          ls -lh artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: TVBox-release-apks
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "Automated signed build ${TVBOX_VERSION_NAME} from commit ${GITHUB_SHA}."
          release_url="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          echo "### Release" >> "$GITHUB_STEP_SUMMARY"
          echo "[$RELEASE_TAG]($release_url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing key
        if: always()
        run: rm -f app/release.p12
