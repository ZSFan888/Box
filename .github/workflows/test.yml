name: Build APKs

on:
#  push:
#    branches:
#      - main
#  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'

      - name: Build release APKs
        run: |
          chmod +x gradlew
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          ./gradlew assembleRelease --build-cache --parallel --no-daemon --stacktrace --warning-mode all

      - name: Collect and verify APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -type f -name '*.apk' -exec cp '{}' artifacts/ \;
          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$apksigner"
          for apk in artifacts/*.apk; do
            "$apksigner" verify --verbose "$apk"
          done
          ls -lh artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: TVBox-release-apks
          path: artifacts/*.apk
          if-no-files-found: error
