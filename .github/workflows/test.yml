name: Build APKs

on:
#  push:
#    branches:
#      - main
#  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --parallel --no-daemon --stacktrace --warning-mode all

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -type f -name '*.apk' -exec cp '{}' artifacts/ \;
          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"
          ls -lh artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-release-apks
          path: artifacts/*.apk
          if-no-files-found: error
